version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: camstack-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camstack-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: camstack
      MODEL_PATH: models/best.pt
      STUDENT_MAP_PATH: models/student_id_map.json
      CONFIDENCE_THRESHOLD: "0.7"
      CONFIRMATION_FRAMES: "3"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/uploads:/app/uploads

volumes:
  mongo_data:
